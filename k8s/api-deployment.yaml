# Deployment de la API: le dice a Kubernetes "quiero 1 copia de este contenedor funcionando".
# Kubernetes no ejecuta este fichero una vez: guarda el estado deseado y lo vigila. Si el pod muere,
# el controlador del Deployment (a través de un ReplicaSet) crea otro.
#
# Versión mínima: sin probes ni límites de memoria (se añaden paso a paso). La BD está en postgres.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: amr-research-agent
spec:
  replicas: 1 # una sola: los límites de /ask y /agent viven en la memoria del proceso
  selector:
    matchLabels: # qué pods son "míos": los que llevan esta etiqueta
      app: amr-research-agent
  template: # la plantilla de cada pod que cree el Deployment
    metadata:
      labels:
        app: amr-research-agent
    spec:
      containers:
        - name: api
          # Imagen construida en local y cargada en kind con `kind load docker-image`. No es
          # `latest`, así que Kubernetes no intenta descargarla de un registro (IfNotPresent).
          image: amr-research-agent:dev
          ports:
            - containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            # La URL sale del Secret de postgres.yaml: si cambia la contraseña, este fichero no se toca.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: DATABASE_URL
