# Deployment de la API: le dice a Kubernetes "quiero 1 copia de este contenedor funcionando".
# Kubernetes no ejecuta este fichero una vez: guarda el estado deseado y lo vigila. Si el pod muere,
# el controlador del Deployment (a través de un ReplicaSet) crea otro.
#
# La BD está en postgres.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: amr-research-agent
spec:
  replicas: 1 # una sola: los límites de /ask y /agent viven en la memoria del proceso
  selector:
    matchLabels: # qué pods son "míos": los que llevan esta etiqueta
      app: amr-research-agent
  template: # la plantilla de cada pod que cree el Deployment
    metadata:
      labels:
        app: amr-research-agent
    spec:
      containers:
        - name: api
          # Imagen construida en local y cargada en kind con `kind load docker-image`. No es
          # `latest`, así que Kubernetes no intenta descargarla de un registro (IfNotPresent).
          image: amr-research-agent:dev
          ports:
            - containerPort: 8000
          # Los ajustes no secretos, todos de golpe desde el ConfigMap de api-config.yaml
          envFrom:
            - configMapRef:
                name: api-config
          env:
            # La URL sale del Secret de postgres.yaml: si cambia la contraseña, este fichero no se toca.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: DATABASE_URL
          # Memoria como en Render Free. `requests` es lo que el scheduler reserva en el nodo para
          # decidir dónde cabe el pod; `limits` es el techo: si el contenedor (API + subproceso
          # amr-mcp, que comparten cgroup) pasa de 512 Mi, el kernel lo mata (OOMKilled) y se
          # reinicia. Medido: 291 MB al arrancar en kind, 367 MiB en el job docker del CI.
          # CPU: solo `requests`. Un límite de CPU no mata, frena (throttling), y con 0,1 CPU como
          # Render el arranque pasaría de 2 s a ~20 s sin enseñar nada nuevo.
          resources:
            requests:
              memory: 400Mi
              cpu: 100m
            limits:
              memory: 512Mi
          # Las tres probes van contra /health, que no consulta la BD a propósito: si Postgres se
          # cae, reiniciar la API no lo arregla (solo añadiría reinicios en bucle).
          #
          # startupProbe: mientras no responda, las otras dos no se ejecutan. Da hasta 2 min
          # (60 × 2 s) para arrancar: modelo de embeddings + amr-mcp tardan ~18 s en Render.
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 2
            failureThreshold: 60
          # readinessProbe: si falla, el pod sigue vivo pero el Service deja de mandarle tráfico.
          # Es lo que hace que, en un rollout, el pod viejo no se retire hasta que el nuevo responde.
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          # livenessProbe: si falla 3 veces seguidas (~30 s colgado), Kubernetes reinicia el contenedor.
          # Timeout de 5 s y no de 1 (el de por defecto): una pregunta al agente ocupa la CPU y
          # no queremos matar una API lenta, solo una colgada.
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
