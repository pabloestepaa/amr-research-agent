# Postgres + pgvector dentro del clúster (solo para el clúster local de kind; en producción la BD es Neon).
# Tres objetos en un fichero, separados por `---`: Secret, Service y StatefulSet.

# Secret: credenciales separadas de los manifiestos que las usan. Ojo: un Secret NO está cifrado, solo
# va en base64 (`stringData` deja escribirlo en claro y Kubernetes lo codifica). Este se sube a git
# porque es una contraseña de desarrollo de un clúster local; uno de verdad (la clave de Groq, la URL
# de Neon) se crea con `kubectl create secret` y nunca entra en el repositorio.
apiVersion: v1
kind: Secret
metadata:
  name: postgres
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: amr_agent
  # La API lee esta clave. "postgres" en el host es el nombre del Service de abajo (lo resuelve CoreDNS).
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/amr_agent
---
# Service: un nombre DNS estable ("postgres") delante de los pods. Los pods cambian de IP cada vez que
# se recrean; el nombre no. `clusterIP: None` lo hace "headless": el DNS devuelve directamente la IP
# del pod, sin balanceador, que es lo que pide un StatefulSet (y con una réplica no hace falta más).
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
---
# StatefulSet y no Deployment: los pods tienen identidad fija (postgres-0) y cada uno conserva SU disco
# aunque se borre y se recree. Un Deployment trata los pods como intercambiables, que es justo lo que
# no quiere una base de datos.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg17 # la misma que el CI; la API crea la extensión `vector`
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres # cada clave del Secret pasa a ser una variable de entorno
          env:
            # Los datos en un subdirectorio del volumen: Postgres se niega a usar un directorio
            # que no esté vacío, y algunos discos traen `lost+found` en la raíz.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          # Readiness: el Service solo manda tráfico al pod cuando esto responde.
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "amr_agent"]
            periodSeconds: 5
  # Un PersistentVolumeClaim por pod ("data-postgres-0"). En kind lo atiende el local-path-provisioner,
  # que crea una carpeta en el nodo. Sobrevive a borrar el pod, no a borrar el clúster.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi # el corpus entero ocupa 39 MB en Neon
