# ConfigMap: los ajustes de la API que no son secretos (los mismos que en render.yaml van con `value:`).
# Separados del Deployment para poder cambiar un ajuste sin tocar la descripción de la API.
# Cada clave llega al contenedor como variable de entorno y la lee config.py (pydantic-settings).
#
# Ojo: cambiar este fichero NO reinicia la API. Las variables de entorno se leen al arrancar, así que
# después de un `kubectl apply` hay que hacer `kubectl rollout restart deployment/api`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
data:
  PORT: "8000"
  LLM_BASE_URL: https://api.groq.com/openai/v1
  LLM_MODEL: openai/gpt-oss-120b
  # Límites de la demo pública, los mismos que en Render
  ASK_PER_IP_PER_MINUTE: "5"
  ASK_PER_DAY: "50"
  AGENT_PER_IP_PER_MINUTE: "1"
  AGENT_PER_DAY: "15"
