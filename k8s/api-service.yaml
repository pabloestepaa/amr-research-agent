# Service de la API: una dirección fija ("api", puerto 80) delante del pod de la API.
# El pod cambia de nombre y de IP cada vez que se recrea (un despliegue, un reinicio); el Service no.
# Reparte las peticiones entre los pods con la etiqueta de abajo, y solo entre los que pasan la
# readinessProbe: por eso, en un despliegue, nadie llega al pod nuevo antes de que esté listo.
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: amr-research-agent # los pods del Deployment de api-deployment.yaml
  ports:
    - port: 80 # el puerto del Service (el que usa quien llama: http://api)
      targetPort: 8000 # el puerto en el que escucha uvicorn dentro del pod
