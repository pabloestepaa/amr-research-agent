[project]
name = "amr-research-agent"
version = "0.1.0"
description = "RAG + tool-using agent over antimicrobial resistance literature, with evals in CI"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Pablo Estepa", email = "pabloestepaalcaide011@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "amr-mcp>=0.1.4",
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "openai>=3.45.0",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
amr-ingest = "amr_agent.ingest.cli:main"
amr-copy-db = "amr_agent.ingest.copy_db:main"
amr-eval-build = "amr_agent.evals.build:main"
amr-eval-retrieval = "amr_agent.evals.retrieval_eval:main"
amr-eval-answers = "amr_agent.evals.answers_eval:main"
amr-eval-agent = "amr_agent.evals.agent_eval:main"
amr-eval-report = "amr_agent.evals.report:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "amr_agent"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "db: needs a Postgres with pgvector (DATABASE_URL_TEST)",
    "network: hits live external APIs",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "respx>=0.23.1",
    "ruff>=0.17.3",
]
