# Evals de respuestas con LLM juez. Gastan cuota de Groq, así que no van en cada PR:
# se lanzan a mano (pestaña Actions -> Run workflow) o una vez por semana.
# Requiere el secret GROQ_API_KEY (Settings -> Secrets and variables -> Actions).
name: Answer evals

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Only the first N questions (empty = all)"
        required: false
  schedule:
    - cron: "0 6 * * 1"  # lunes a las 06:00 UTC

jobs:
  answer-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amr_agent_eval
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_EVAL: postgresql://postgres:postgres@localhost:5432/amr_agent_eval
      FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
      LLM_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/fastembed
          key: fastembed-bge-small-en-v1.5
      - name: Run answer evals
        run: |
          LIMIT="${{ github.event.inputs.limit }}"
          uv run amr-eval-answers --load-corpus --name answers_ci ${LIMIT:+--limit "$LIMIT"}
      - name: Job summary
        if: always()
        run: |
          uv run python -c "import json; from amr_agent.evals.report import answers_table; \
          print(answers_table(json.load(open('evals/results/answers_ci.json'))))" \
          >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: answer-eval
          path: evals/results/answers_ci.json
