# Tests + lint + evals de búsqueda en cada push y PR. No usa claves ni gasta cuota de LLM.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amr_agent_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/amr_agent_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q

  retrieval-evals:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amr_agent_eval
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_EVAL: postgresql://postgres:postgres@localhost:5432/amr_agent_eval
      FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/fastembed
          key: fastembed-bge-small-en-v1.5
      # Carga el snapshot (evals/corpus.jsonl), mide recall@k/MRR/nDCG y falla si alguna
      # métrica baja de evals/thresholds.json.
      - run: uv run amr-eval-retrieval --load-corpus --check --name retrieval_ci
      - name: Job summary
        if: always()
        run: |
          uv run python -c "import json; from amr_agent.evals.report import retrieval_table; \
          print(retrieval_table(json.load(open('evals/results/retrieval_ci.json'))))" \
          >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-eval
          path: evals/results/retrieval_ci.json

  # Construye la imagen de producción y la arranca contra un Postgres vacío: detecta antes
  # de desplegar en Render un Dockerfile roto, un fichero que no entra en la imagen o un
  # consumo de memoria que no cabría en los 512 MB del plan gratuito.
  docker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amr_agent
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: amr-research-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run container (512 MB, like Render Free)
        run: |
          docker run -d --name api --network host --memory 512m \
            -e PORT=8000 \
            -e DATABASE_URL=postgresql://postgres:postgres@localhost:5432/amr_agent \
            -e LLM_BASE_URL=http://localhost:9/v1 \
            amr-research-agent:ci
          for i in $(seq 1 60); do
            curl -fsS localhost:8000/health && break
            sleep 2
          done
      - name: Smoke test
        run: |
          curl -fsS localhost:8000/ | grep -q "AMR Research Agent"
          # BD vacía: la búsqueda debe responder 200 con una lista vacía (ejercita el modelo)
          test "$(curl -fsS 'localhost:8000/search?q=colistin%20resistance')" = "[]"
          # El LLM apunta a un puerto cerrado: si amr-mcp arrancó, /agent llega a llamar al LLM y
          # responde 502; un 503 significaría que el agente está desactivado (amr-mcp no arrancó).
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/agent \
            -H 'Content-Type: application/json' -d '{"question": "What is mcr-1?"}')
          echo "/agent -> $code"; test "$code" = "502"
          # Incluye el subproceso amr-mcp con el catálogo ya cargado (lo calienta el lifespan)
          docker stats --no-stream --format 'Memory: {{.MemUsage}}' api | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Container logs
        if: always()
        run: docker logs api

  # Lo mismo que el job docker, pero instalando el chart de Helm en un Kubernetes de verdad (kind):
  # detecta un chart roto (plantillas, probes, nombres, Secrets) antes de usarlo en un cloud.
  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.2
      - run: helm lint charts/amr-research-agent
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: amr-research-agent:ci
          cache-from: type=gha # comparte la caché con el job docker: no se reconstruye
      - name: Create kind cluster
        uses: helm/kind-action@v1.15.2
        with:
          cluster_name: ci
      # kind no ve las imágenes de Docker: hay que cargarla en su nodo.
      - run: kind load docker-image amr-research-agent:ci --name ci
      - name: Install chart
        # Sin Secret `llm` (no hay clave en el CI) y el LLM en un puerto cerrado, como en el job docker.
        run: |
          helm install amr charts/amr-research-agent --wait --timeout 5m \
            --set image.tag=ci \
            --set config.LLM_BASE_URL=http://localhost:9/v1
      - name: Smoke test
        run: |
          kubectl port-forward svc/amr-api 8000:80 >/dev/null 2>&1 &
          sleep 3
          curl -fsS localhost:8000/health
          curl -fsS localhost:8000/ | grep -q "AMR Research Agent"
          test "$(curl -fsS 'localhost:8000/search?q=colistin%20resistance')" = "[]"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/agent \
            -H 'Content-Type: application/json' -d '{"question": "What is mcr-1?"}')
          echo "/agent -> $code"; test "$code" = "502"
          # 0 reinicios: ni falta de memoria (límite de 512 Mi) ni arrancar antes que Postgres
          restarts=$(kubectl get pod -l app=amr-api -o jsonpath='{.items[0].status.containerStatuses[0].restartCount}')
          echo "API restarts: $restarts" | tee -a "$GITHUB_STEP_SUMMARY"; test "$restarts" = "0"
      - name: Cluster state and logs
        if: always()
        run: |
          kubectl get pods,svc,pvc
          kubectl describe pod -l app=amr-api | tail -20
          kubectl logs -l app=amr-api --tail=50

  # Publica la imagen en GitHub Container Registry (gratis para repos públicos) para que la descargue
  # Azure Container Apps. Solo en push a main y solo si todo lo demás ha pasado: nunca se publica una
  # imagen que no arranca. Lleva el código (ya público), las dependencias, el modelo bge-small (MIT) y
  # el catálogo de genes de NCBI (dominio público); ningún secreto (el Dockerfile no copia .env).
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, retrieval-evals, docker, kubernetes]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # para subir a ghcr.io con el GITHUB_TOKEN, sin claves propias
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Etiquetas: `sha-<commit>` (fija, para desplegar una versión concreta) y `latest`. También añade
      # la etiqueta OCI que enlaza el paquete con este repositorio.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha # la misma caché que los jobs docker y kubernetes
