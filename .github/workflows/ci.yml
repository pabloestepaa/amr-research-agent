# Tests + lint + evals de búsqueda en cada push y PR. No usa claves ni gasta cuota de LLM.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amr_agent_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/amr_agent_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q

  retrieval-evals:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amr_agent_eval
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_EVAL: postgresql://postgres:postgres@localhost:5432/amr_agent_eval
      FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/fastembed
          key: fastembed-bge-small-en-v1.5
      # Carga el snapshot (evals/corpus.jsonl), mide recall@k/MRR/nDCG y falla si alguna
      # métrica baja de evals/thresholds.json.
      - run: uv run amr-eval-retrieval --load-corpus --check --name retrieval_ci
      - name: Job summary
        if: always()
        run: |
          uv run python -c "import json; from amr_agent.evals.report import retrieval_table; \
          print(retrieval_table(json.load(open('evals/results/retrieval_ci.json'))))" \
          >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-eval
          path: evals/results/retrieval_ci.json

  # Construye la imagen de producción y la arranca contra un Postgres vacío: detecta antes
  # de desplegar en Render un Dockerfile roto, un fichero que no entra en la imagen o un
  # consumo de memoria que no cabría en los 512 MB del plan gratuito.
  docker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amr_agent
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: amr-research-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run container (512 MB, like Render Free)
        run: |
          docker run -d --name api --network host --memory 512m \
            -e PORT=8000 \
            -e DATABASE_URL=postgresql://postgres:postgres@localhost:5432/amr_agent \
            amr-research-agent:ci
          for i in $(seq 1 60); do
            curl -fsS localhost:8000/health && break
            sleep 2
          done
      - name: Smoke test
        run: |
          curl -fsS localhost:8000/ | grep -q "AMR Research Agent"
          # BD vacía: la búsqueda debe responder 200 con una lista vacía (ejercita el modelo)
          test "$(curl -fsS 'localhost:8000/search?q=colistin%20resistance')" = "[]"
          docker stats --no-stream --format 'Memory: {{.MemUsage}}' api | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Container logs
        if: always()
        run: docker logs api
